name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: clipmaker, POSTGRES_PASSWORD: clipmaker, POSTGRES_DB: clipmaker_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m venv .venv && .venv/bin/pip install -e ".[dev]"
      - run: .venv/bin/ruff check src ../tests/backend && .venv/bin/ruff format --check src ../tests/backend
      - run: .venv/bin/mypy src
      - run: .venv/bin/pytest --cov=clipmaker --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - name: Shared types are up to date with the backend contract
        run: |
          python -m venv backend/.venv && backend/.venv/bin/pip install -e backend
          ./scripts/gen-types.sh
          git diff --exit-code common/types
      - run: npm run lint:web
      - run: npm run typecheck:web
      - run: npm run test:web
      - run: npm run build:web
        env: { NEXT_TELEMETRY_DISABLED: "1" }
