# Clip2Easy on one server (built for Oracle Cloud's Always Free ARM machine).
#
#   cp .env.example .env   # fill in the secrets
#   docker compose up -d --build
#
# Caddy gets a free HTTPS certificate for your domain automatically. Everything runs on this
# one box: API, worker, database, cache. Clips live in Cloudflare R2 when S3_* is set, or on
# the server's disk when it is not.
x-backend: &backend
  build: ../../backend
  restart: unless-stopped
  env_file: .env
  environment:
    APP_ENV: production
    DATABASE_URL: postgresql+psycopg://clipmaker:${POSTGRES_PASSWORD}@db:5432/clipmaker
    REDIS_URL: redis://redis:6379/0
    WORK_DIR: /app/.data/work
    LOCAL_STORAGE_DIR: /app/.data/storage
  volumes: [media:/app/.data]
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: clipmaker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: clipmaker
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "clipmaker"], interval: 5s, retries: 20 }

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }

  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *backend
    command:
      ["uvicorn", "clipmaker.main:app", "--host", "0.0.0.0", "--port", "8000",
       "--proxy-headers", "--forwarded-allow-ips", "*"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    <<: *backend
    # One worker process; clips inside a job already render side by side across the CPUs.
    command:
      ["celery", "-A", "clipmaker.workers.celery_app", "worker", "--beat",
       "--schedule", "/tmp/celerybeat-schedule", "-Q", "pipeline,render",
       "--concurrency", "1", "--loglevel", "INFO"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { API_DOMAIN: "${API_DOMAIN}" }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api]

volumes: { pgdata: {}, media: {}, caddy_data: {} }
